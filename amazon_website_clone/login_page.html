<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="login_page.css">
</head>
<body>
  <header>
    <div class="parent_frame">
      <div class="child_frame"></div>
    </div>
  </header>
  <main>
    <div class="frame">
      <div class="inner_frame">
        <div class="sub_frame">
          <h1>Sign in or create account</h1>
          <form action="amazon_clone.html">
            <p class="label_bar">Enter mobile number or email</p>
            <input type="text" id="enter_bar" required>
            <br><br>
            <input id="continue_button" type="submit" value="Continue">
          </form>
          <br>
          <p class="para">By continuing, you agree to Amazon's <a href="#">Conditions<br>
             of Use</a> and <a href="#">Privacy Notice</a>
          </p>
          <p><a href="#">Need help?</a>
          </p>
          <hr>
          <span class="label_bar">Buying for work?</span>
          <span class="account_creating"><a href="#">Create a free business account</a></span>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="line_one">
      <ul>
        <li><a href="#">Conditions of Use</a></li>
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Notice Help</a></li>
      </ul>
    </div>
    <div class="line_two">
      <span>© 1996-2026, Amazon.com, Inc. or its affiliates</span>
    </div>
  </footer>
</body>
</html>
